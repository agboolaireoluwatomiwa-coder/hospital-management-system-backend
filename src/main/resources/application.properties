spring.application.name=hospital-backend

# --- PostgreSQL (create the database first: CREATE DATABASE hospital_db;) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Ireoluwa123}

# Tables are created by schema.sql (see src/main/resources), not by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

server.port=8080
server.error.include-message=always

# --- JWT (secret must be at least 32 characters) ---
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiry-ms=86400000

# --- CORS ---
app.cors.allowed-origin=http://localhost:5173

# --- First admin account, created on startup if no users exist ---
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD:admin123}
